# This patch adds the args to allow exposing the metrics endpoint using HTTP/HTTPS
# Metrics are disabled when metrics-bind-address is 0

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --metrics-bind-address=:0

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --metrics-secure=false

